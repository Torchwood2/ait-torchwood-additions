plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // AmbleKit (AIT's library)
    maven {
        url = "https://jitpack.io"
        metadataSources {
            artifact()
        }
        content {
            includeGroup "com.github.amblelabs"
        }
    }

    // MultiDim, Scheduler and Queue (AmbleKit's own libraries)
    maven {
        url = "https://theo.is-a.dev/maven/"
        content {
            includeGroup "dev.drtheo"
        }
    }

    // YetAnotherConfigLib
    maven {
        url = "https://maven.isxander.dev/releases"
        content {
            includeGroup "dev.isxander"
            includeGroup "org.quiltmc.parsers"
        }
    }

    // Adventures in Time and Moonlight Lib
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    // Supplementaries and Copper & Tuff Backport
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Adventures in Time
    modImplementation "maven.modrinth:ait:${project.ait_version}"

    // AIT's own dependencies
    modImplementation("com.github.amblelabs:modkit:${project.amblekit_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    // AmbleKit bundles these inside its jar for players, but the dev client doesn't load jars nested in
    // a dependency, so they're listed here too (not bundled into ATA).
    modImplementation("dev.drtheo:multidim:${project.multidim_version}") { exclude(group: "net.fabricmc.fabric-api") }
    modImplementation("dev.drtheo:scheduler:${project.scheduler_version}") { exclude(group: "net.fabricmc.fabric-api") }
    modImplementation("dev.drtheo:queue:${project.queue_version}") { exclude(group: "net.fabricmc.fabric-api") }
    modImplementation "maven.modrinth:animator:${project.animator_version}"
    implementation "net.objecthunter:exp4j:0.4.8"
    modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

    // Supplementaries (needs Moonlight Lib)
    modImplementation "curse.maven:supplementaries-412082:${project.supplementaries_file}"
    modImplementation "maven.modrinth:moonlight:${project.moonlight_version}"
    modImplementation "curse.maven:amendments-896746:${project.amendments_file}"

    // Copper & Tuff Backport
    modImplementation "curse.maven:copper-tuff-backport-fabric-950738:${project.copper_tuff_file}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version

    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
